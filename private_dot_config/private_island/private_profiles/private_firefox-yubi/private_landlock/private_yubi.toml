abi = 10

[[ruleset]]
handled_access_fs = ["abi.all"]
scoped = ["abi.all"]

# Yubikey
[[path_beneath]]
allowed_access = ["abi.read_write"]
parent = [
    "/dev/hidraw0",
    "/dev/hidraw1",
    "/dev/hidraw2",
    "/dev/hidraw3",
    "/dev/hidraw4",
]

# and finding it.
[[path_beneath]]
allowed_access = [
    "read_dir",
    "read_file",
]
parent = [
    "/sys",
]
